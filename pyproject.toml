# Оркестратор (основной API). venv: .venv
# Источник зависимостей. requirements.txt — закреплённый lock (uv pip compile).
# Установка: uv pip install -r requirements.txt  (или pip install -r requirements.txt)
[project]
name = "ai-dos-orchestrator"
version = "0.1.0"
description = "Ai-dos — голосовой цифровой офицер АФМ: оркестратор STT -> RAG -> TTS"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openai==1.59.6",
    "httpx==0.28.1",
    "numpy==2.2.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    # Числа -> слова для русской озвучки (F5 цифры не читает). Без пакета озвучка
    # чисел на русском молча деградирует (импорт в tts.py обёрнут в try/except).
    "num2words==0.5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Локальный казахский STT (Whisper-kk, STT_KK_USE_WHISPER=true). НЕ нужен, когда
# казахский STT на сервере АФМ (:8804) или whisper_kk_server — оркестратор тогда
# лёгкий (без torch/CUDA). Ставить: pip install -r requirements-whisper-kk.txt
# (на CPU-машине сперва CPU-сборку torch — см. тот файл). Зеркалит requirements-whisper-kk.txt.
whisper-kk = [
    "torch==2.12.1",
    "transformers==5.12.1",
    "accelerate==1.14.0",
    "librosa==0.11.0",
    "soundfile==0.14.0",
]

[tool.uv]
package = false        # это приложение, не библиотека — ставим только зависимости
