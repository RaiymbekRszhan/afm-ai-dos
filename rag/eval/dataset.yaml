# Тест-набор для оценки ответов RAG-сервиса.
#
# Поля кейса:
#   question            — вопрос гражданина (как пришёл бы после STT)
#   lang                — ru | kk (по умолчанию ru)
#   expect_contains     — список подстрок, КАЖДАЯ обязана быть в ответе (регистр неважен)
#   expect_contains_any — достаточно ОДНОГО совпадения (напр. сумма словами ИЛИ цифрами)
#   expect_source       — метка источника, на которую ответ должен сослаться
#                         (ищется в тексте ответа И в поле sources)
#   expect_fallback     — true, если ответа в базе НЕТ и должен сработать отказ
#                         «нет информации → 1458» (проверка против выдумывания, ru+kk)
#
# Источник истины — реальное содержимое rag/data/ (сверено 2026-06-25). Суммы в
# законе записаны цифрами; LLM может проговаривать словами — поэтому суммы заданы
# через expect_contains_any (и цифрами, и словами). Цитаты надёжнее всего ловятся
# по expect_source (метка уходит в sources). Вопросы — из реального трафика бота 1458.

cases:
  # ====================== РУССКИЙ: факты + цитата ======================
  - question: "Какой порог по сделкам с недвижимостью?"
    lang: ru
    expect_source: "статья 4"
    expect_contains_any: ["пятьдесят миллионов", "50 миллионов", "50 000 000"]

  - question: "Я предприниматель, являюсь ли я субъектом финансового мониторинга?"
    lang: ru
    expect_source: "статья 3"

  # Определение из «Основных понятий» (ст. 1) — проверяем смысл, а не ссылку на статью
  - question: "Что считается подозрительной операцией?"
    lang: ru
    expect_contains_any: ["легализ", "отмыван", "преступн"]

  - question: "Что грозит за мошенничество?"
    lang: ru
    expect_source: "статья 190"

  - question: "Какое наказание за создание финансовой пирамиды?"
    lang: ru
    expect_source: "статья 217"

  - question: "Какой штраф для субъекта финмониторинга за непредставление сведений?"
    lang: ru
    expect_source: "статья 214"
    expect_contains: ["штраф"]

  # ====================== РУССКИЙ: перенаправления (FAQ) ======================
  - question: "Куда жаловаться на действия банка или микрофинансовой организации?"
    lang: ru
    expect_contains: ["1459"]

  - question: "Коллекторы угрожают и требуют оплатить долг. Как быть?"
    lang: ru
    expect_contains_any: ["1459", "102"]

  - question: "По какому номеру звонить в call-центр Агентства?"
    lang: ru
    expect_contains: ["1458"]

  - question: "Мошенники оформили на меня кредит, что делать?"
    lang: ru
    expect_contains: ["102"]

  # ====================== РУССКИЙ: новый контент (памятки о мошенничестве) ======================
  - question: "Что делать, если я стал жертвой мошенников?"
    lang: ru
    expect_source: "Финансовая безопасность"
    expect_contains_any: ["102", "qamqor"]

  - question: "Мне звонят якобы из банка и просят код из СМС. Что делать?"
    lang: ru
    expect_source: "Финансовая безопасность"

  # ====================== РУССКИЙ: справка ======================
  - question: "Можно ли пронести телефон в здание Агентства?"
    lang: ru
    expect_source: "Справка"

  # ====================== РУССКИЙ: антивыдумка (должен отказаться) ======================
  - question: "Какая ставка по ипотеке в банке?"
    lang: ru
    expect_fallback: true

  - question: "Какой штраф за превышение скорости?"
    lang: ru
    expect_fallback: true

  - question: "Сколько стоит оформить загранпаспорт?"
    lang: ru
    expect_fallback: true

  # ====================== КАЗАХСКИЙ: факты + цитата ======================
  - question: "Мен кәсіпкермін, қаржы мониторингі субъектісі болып табыламын ба?"
    lang: kk
    expect_source: "3-бап"

  - question: "Жылжымайтын мүлікпен мәміле бойынша шекті сома қандай?"
    lang: kk
    expect_source: "4-бап"
    expect_contains_any: ["50 000 000", "елу миллион"]

  # Анықтама «Негізгі ұғымдардан» (1-бап) — мағынасын тексереміз, бапқа сілтемені емес
  - question: "Күдікті операция деген не?"
    lang: kk
    expect_contains_any: ["заңдастыру", "қылмыстық"]

  # ====================== КАЗАХСКИЙ: перенаправления / мошенничество ======================
  - question: "Коллекторлар қорқытып жатыр, не істеу керек?"
    lang: kk
    expect_contains_any: ["102", "1459"]

  - question: "Агенттіктің байланыс орталығының нөмірі қандай?"
    lang: kk
    expect_contains: ["1458"]

  - question: "Алаяқтардың құрбаны болсам, не істеуім керек?"
    lang: kk
    expect_source: "Қаржылық қауіпсіздік"
    expect_contains_any: ["102", "qamqor"]

  # ====================== КАЗАХСКИЙ: антивыдумка ======================
  - question: "Ипотека бойынша пайыздық мөлшерлеме қандай?"
    lang: kk
    expect_fallback: true

  - question: "Жол қозғалысы ережесін бұзғаны үшін айыппұл қанша?"
    lang: kk
    expect_fallback: true

  # ============ КТО ТЫ: ответ не из базы, но НА ЯЗЫКЕ ВОПРОСА ============
  # Реальный случай с киоска 30.07: на казахское «Сен кімсің?» пришёл РУССКИЙ
  # ответ — модель пересказывала русский блок ---Роль--- из промпта. Казахские
  # подстроки ниже и есть проверка языка: при русском ответе кейс упадёт.
  - question: "Сен кімсің?"
    lang: kk
    expect_contains: ["Ai-dos", "жауап беремін"]

  - question: "Кто ты такой?"
    expect_contains: ["Ai-dos", "финансовому мониторингу"]
