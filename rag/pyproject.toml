# RAG-сервис (LightRAG, ответ строго по базе РК). venv: rag/.venv
# ОТДЕЛЬНЫЙ от оркестратора (lightrag/torch конфликтуют с голосовым слоем).
# Установка: uv pip install -r requirements.txt  (или pip install -r requirements.txt)
[project]
name = "ai-dos-rag"
version = "0.1.0"
description = "Ai-dos RAG: поиск по кодексам/законам РК (LightRAG, режим naive)"
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku==1.4.9.10",
    "openai>=1.30",
    "numpy",
    "tiktoken",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[tool.uv]
package = false
