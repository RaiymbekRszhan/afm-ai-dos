<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai-dos — цифровой офицер АФМ</title>
  <style>
    /* Фон и «карточки» — чёрные: на киоске так текст читается контрастнее, а
       белые QR-карточки на чёрном подсвечиваются ярче (просьба 2026-07-20; было
       --bg:#0f172a / --card:#1e293b — слейт-синий, «кричал» бликом на экране). */
    :root { --bg:#000; --card:#000; --accent:#3b62f6; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg);
           color: #e2e8f0; display: flex; flex-direction: column; }
    header { padding: 10px 18px; font-size: 16px; font-weight: 600; background: var(--card); }
    header span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }
    #stage { flex: 1; position: relative; background: #000; overflow: hidden; }
    /* Два ролика лежат друг на друге; переключаем прозрачностью — без перезагрузки
       <video> и без чёрного мига между idle и «говорит».
       contain — кадр виден ЦЕЛИКОМ при любой форме окна (по бокам могут быть чёрные
       поля, фон #000 — выглядит как леттербокс). cover заполнил бы область без полей,
       но в окне, чей аспект не совпал с роликом, срезал бы аватара по краям (вплоть до
       лица). Когда область подогнана под аспект ролика (киоск + --stage-ar / ?ar),
       contain и cover дают ОДИНАКОВУЮ картинку — полей нет и резать нечего. */
    #stage video { position: absolute; inset: 0; width: 100%; height: 100%;
                   object-fit: contain; transition: opacity .25s ease; }
    #talk { opacity: 0; }
    #talk.on { opacity: 1; }
    #idle.off { opacity: 0; }
    #noVid { position: absolute; inset: 0; display: none; align-items: center;
             justify-content: center; flex-direction: column; gap: 10px; text-align: center;
             padding: 20px; font-size: 15px; color: var(--muted); }
    #noVid code { color: #e2e8f0; }
    #bar { display: flex; gap: 12px; align-items: center; padding: 14px 18px;
           background: var(--card); flex-wrap: wrap; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
             padding: 12px 22px; font-size: 16px; cursor: pointer; }
    button.rec { background: #ef4444; }
    select { background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
             border-radius: 8px; padding: 10px; font-size: 15px; }
    #status { color: var(--muted); font-size: 14px; }
    #out { padding: 0 18px 14px; background: var(--card); font-size: 14px;
           white-space: pre-wrap; color: #cbd5e1; max-height: 130px; overflow: auto; }

    #out .qline { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    #out .aline { white-space: pre-wrap; }
    /* «Караоке»: прочитанные голосом слова подсвечиваются по ходу озвучки */
    #out .aline .w { transition: color .2s ease; }
    #out .aline .w.spoken { color: #8fb3ff; }
    #out.idle { color: var(--muted); font-style: italic; }
    /* Ответ с таблицей/графиком (см. answer_render.js) — панели нужно больше места. */
    #out.rich { max-height: 45vh; }
    #out .aidos-tablewrap { overflow-x: auto; }
    #out .aidos-table { border-collapse: collapse; margin: 10px 0; width: 100%; }
    /* 4+ колонок (dense): колонки делят ширину ПОРОВНУ и слова переносятся —
       таблица никогда не шире карточки (прокрутку на киоске никто не найдёт). */
    #out .aidos-table.dense { table-layout: fixed; }
    #out .aidos-table.dense th, #out .aidos-table.dense td { overflow-wrap: break-word; }
    #out .aidos-table th, #out .aidos-table td { border: 1px solid #334155;
           padding: 6px 10px; text-align: left; vertical-align: top; }
    #out .aidos-table th { background: #253347; color: #e6edf6; font-weight: 600; }
    #out .aidos-table td { color: #cbd5e1; }
    .aidos-chart { display: block; width: 100%; max-width: 900px; height: auto;
           margin: 4px 0 10px; }
    /* QR-коды порталов (e-Otinish, qamqor…): белая карточка обязательна —
       QR на тёмном фоне телефоны читают плохо. */
    .qr-row { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 4px; }
    .qr-card { background: #fff; border-radius: 12px; padding: 10px 12px;
           text-align: center; }
    .qr-card img { display: block; width: 128px; height: 128px;
           image-rendering: pixelated; margin: 0 auto; }
    .qr-card .qr-label { color: #1e293b; font-size: 13px; font-weight: 600;
           margin-top: 4px; }

    #langBadge { position: absolute; bottom: 22px; right: 22px; z-index: 4; display: none;
           align-items: center; justify-content: center; border: 0; cursor: pointer;
           width: clamp(72px, 9vh, 150px); height: clamp(72px, 9vh, 150px);
           border-radius: 50%; background: var(--accent); color: #fff;
           box-shadow: 0 4px 16px rgba(0,0,0,.45);
           font-weight: 600; font-size: clamp(22px, 2.4vh, 52px); }

    /* ---- Режим киоска (?kiosk=1): крупные кнопки, бейдж языка, аспект видео ---- */
    body.kiosk header { display: none; }
    /* Кадр наших роликов 1080×1152, но в САМ КАДР вшиты чёрные поля по 150px
       сверху/снизу — полезный контент 1080×852 (замерено по пикселям, симметрично).
       Поэтому в киоске область = аспект КОНТЕНТА (1080/852), а видео — cover:
       он срезает ровно вшитые поля (контент не трогается), на экране ни черноты,
       ни обрезанного лица, и ниже остаётся больше места под ответ/таблицу.
       Заменишь ролики — перемерь поля; чистым роликам без вшитых полей ставь
       аспект их кадра (или передай ?ar=<ш>/<в> — тогда этот дефолт не действует). */
    body.kiosk #stage { flex: none; width: 100%;
           aspect-ratio: var(--stage-ar, 1080 / 852); height: auto; }
    body.kiosk #stage video { object-fit: cover; }
    body.kiosk #langBadge { display: flex; }
    body.kiosk #out { order: 2; flex: 1; margin: 14px 20px 20px; padding: 30px 40px; overflow: auto;
           background: var(--card); border-radius: 22px; max-height: none; }
    /* Размеры текста ответа: были 2vh/52px — на длинном ответе текст «кричал»
       и заполнял карточку с прокруткой (замечание 2026-07-17). */
    body.kiosk #out.idle { display: flex; align-items: center; justify-content: center;
           text-align: center; font-size: clamp(20px, 1.7vh, 40px); }
    body.kiosk #out .qline { font-size: clamp(18px, 1.4vh, 36px); color: #e6edf6;
           font-weight: 600; text-align: center; margin-bottom: 16px; padding-bottom: 12px;
           border-bottom: 1px solid #334155; }
    body.kiosk #out .aline { font-size: clamp(20px, 1.6vh, 40px); line-height: 1.5;
           color: #e6edf6; letter-spacing: .2px; }
    body.kiosk #bar { order: 1; justify-content: center; padding: 18px 18px 26px; gap: 20px; }
    body.kiosk #bar select { display: none; }
    body.kiosk button#rec { font-size: clamp(24px, 1.7vh, 46px); padding: 22px 48px; border-radius: 16px; }
    body.kiosk #status { display: none; }
    body.kiosk #out .aidos-table { font-size: clamp(18px, 1.6vh, 40px); }
    body.kiosk #out .aidos-table th, body.kiosk #out .aidos-table td { padding: 12px 18px; }
    /* 4+ колонок: мельче и плотнее, иначе не влезает по ширине карточки */
    body.kiosk #out .aidos-table.dense { font-size: clamp(14px, 1.15vh, 26px); }
    body.kiosk #out .aidos-table.dense th, body.kiosk #out .aidos-table.dense td { padding: 8px 10px; }
    /* QR-код показываем ПОВЕРХ видео — на груди/галстуке аватара (как на старом
       киоске: гражданин снимает код, не теряя аватара из виду), умеренного
       размера, а не отдельным блоком под ответом. Overlay живёт внутри #stage,
       виден только когда в ответе есть ссылка (.on). pointer-events:none — не
       перехватывает тап/жест (fullscreen, «Задать вопрос»). Размер задаём в vw
       (=ширина кадра в киоске) — привязан к аватару, не к высоте экрана. */
    #qrOverlay { position: absolute; left: 0; right: 0; bottom: 7%;
           z-index: 3; display: none; pointer-events: none; }
    #qrOverlay.on { display: block; }
    #qrOverlay .qr-row { margin: 0; gap: 18px; justify-content: center; }
    #qrOverlay .qr-card { padding: 12px 14px; box-shadow: 0 6px 26px rgba(0,0,0,.55); }
    #qrOverlay .qr-card img { width: clamp(150px, 23vw, 260px); height: clamp(150px, 23vw, 260px); }
    #qrOverlay .qr-card .qr-label { font-size: clamp(13px, 1.5vw, 20px); margin-top: 6px; }

    /* ---- Увеличение по тапу (просьба руководителя): таблица/график/QR ---- */
    #out .aidos-tablewrap, #out .aidos-chart, #out .qr-card { cursor: zoom-in; }
    #zoom { position: fixed; inset: 0; z-index: 50; display: none;
            align-items: center; justify-content: center; padding: 3vh 3vw;
            background: rgba(3, 8, 20, .93); cursor: zoom-out; }
    #zoom.on { display: flex; }
    #zoomBody { max-width: 95vw; max-height: 90vh; overflow: auto;
                background: var(--card); border-radius: 20px; padding: 28px; }
    #zoomClose { position: fixed; top: 18px; right: 18px; z-index: 51;
                 width: clamp(48px, 6vh, 88px); height: clamp(48px, 6vh, 88px);
                 border-radius: 50%; border: 0; background: var(--accent);
                 color: #fff; font-size: clamp(22px, 2.6vh, 40px); cursor: pointer; }
    /* увеличенные версии: таблица крупнее, график шире, QR почти во весь экран */
    #zoomBody .aidos-table { font-size: clamp(20px, 2vh, 42px); margin: 0; }
    #zoomBody .aidos-table th, #zoomBody .aidos-table td { padding: 14px 20px; }
    #zoomBody .aidos-table.dense { font-size: clamp(16px, 1.6vh, 34px); }
    #zoomBody .aidos-chart { width: min(90vw, 1500px); max-width: none; margin: 0; }
    #zoomBody .qr-card { padding: 4vh 4vw; }
    #zoomBody .qr-card img { width: min(62vh, 78vw); height: min(62vh, 78vw); }
    #zoomBody .qr-card .qr-label { font-size: clamp(18px, 2vh, 40px); margin-top: 12px; }
    body.kiosk .aidos-chart { max-width: 900px; margin: 8px auto 0; }
    /* Ответ С ТАБЛИЦЕЙ — чуть плотнее обычного: вопрос + текст + таблица + график
       должны влезать на киоск 1080×1920 ЦЕЛИКОМ, без прокрутки (замерено на demo). */
    body.kiosk #out.rich { padding: 22px 32px; margin-top: 10px; }
    body.kiosk #out.rich .qline { margin-bottom: 12px; padding-bottom: 10px; }
    body.kiosk #out.rich .aline { font-size: clamp(18px, 1.45vh, 36px); line-height: 1.4; }

    /* ---- Печать образцов заявлений (кнопка + меню вариантов) ----
       Когда ответ про подачу заявления/жалобы или запись на приём (заголовок
       X-Print с бэкенда), рядом с «Задать вопрос» встаёт зелёная кнопка печати.
       Само приглашение аватар ПРОГОВАРИВАЕТ и оно уже в тексте ответа (бэкенд
       дописал) — отдельной плашки нет. Клик открывает меню выбора образца;
       печать — готовый PDF-бланк в скрытом iframe (с Chrome --kiosk-printing
       уходит на принтер без диалога). */
    #printBtn { background: #15925a; }
    #printBtn[hidden] { display: none; }
    body.kiosk button#printBtn { font-size: clamp(20px, 1.5vh, 42px); padding: 22px 40px; border-radius: 16px; }

    #printMenu { position: fixed; inset: 0; z-index: 60; display: none;
           align-items: center; justify-content: center; padding: 4vh 4vw;
           background: rgba(3, 8, 20, .94); }
    #printMenu.on { display: flex; }
    #printCard { background: var(--card); border: 1px solid #334155; border-radius: 22px;
           padding: 30px 28px; width: min(680px, 92vw); text-align: center; }
    #printCard h2 { margin: 0 0 6px; font-size: clamp(22px, 2.2vh, 40px); color: #e6edf6; }
    #printCard .sub { color: var(--muted); font-size: clamp(15px, 1.4vh, 26px); margin-bottom: 18px; }
    .print-lang { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .print-lang button { background: #0f172a; border: 1px solid #334155; color: #cbd5e1;
           font-size: clamp(16px, 1.5vh, 28px); padding: 10px 24px; }
    .print-lang button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .print-opts { display: flex; flex-direction: column; gap: 14px; }
    .print-opts button { background: var(--accent); font-size: clamp(18px, 1.7vh, 34px); padding: 20px; width: 100%; }
    #printCancel { margin-top: 18px; background: transparent; border: 1px solid #475569;
           color: #cbd5e1; font-size: clamp(15px, 1.4vh, 26px); }
  </style>
</head>
<body>
  <header>🇰🇿 Ai-dos — цифровой офицер АФМ
    <span>задайте вопрос голосом — отвечу по базе законов РК</span></header>

  <div id="stage">
    <!-- muted+autoplay+playsinline: немое видео браузер пускает БЕЗ жеста пользователя,
         поэтому idle крутится сразу. Звук ответа — отдельный <audio> (нужен жест). -->
    <video id="idle" src="/static/video/idle.mp4" muted loop playsinline autoplay preload="auto"></video>
    <video id="talk" src="/static/video/talk.mp4" muted loop playsinline preload="auto"></video>
    <button id="langBadge" title="Сменить язык">RU</button>
    <!-- QR-коды порталов «висят» здесь — поверх видео, на груди/галстуке аватара
         (см. #qrOverlay в CSS). Наполняет answer_render.js, показ — класс .on. -->
    <div id="qrOverlay"></div>
    <div id="noVid">
      <div>Нет роликов аватара.</div>
      <div>Положи <code>idle.mp4</code> и <code>talk.mp4</code> в <code>video_ui/static/video/</code></div>
    </div>
  </div>

  <div id="bar">
    <button id="rec">🎙 Задать вопрос</button>
    <!-- Появляется, когда ответ про подачу заявления/приём (см. JS). Печать —
         через скрытый iframe #printFrame. -->
    <button id="printBtn" hidden>🖨 Распечатать образец</button>
    <select id="lang">
      <option value="russian">Русский</option>
      <option value="kazakh">Қазақша</option>
    </select>
    <span id="status">готов</span>
  </div>
  <div id="out"></div>

  <!-- Увеличение таблицы/графика/QR по тапу: клон элемента поверх всего экрана -->
  <div id="zoom"><div id="zoomBody"></div></div>
  <button id="zoomClose" hidden>✕</button>

  <!-- Меню выбора образца заявления (открывает кнопка «Распечатать образец»).
       Кнопки строит JS из подошедших образцов; печать — PDF-бланк в iframe. -->
  <div id="printMenu">
    <div id="printCard">
      <h2 id="printTitle">Распечатать образец</h2>
      <div class="sub" id="printSub">Выберите документ — киоск его распечатает</div>
      <div class="print-lang">
        <button data-l="ru">Рус</button>
        <button data-l="kz">Қаз</button>
      </div>
      <div class="print-opts" id="printOpts"></div>
      <button id="printCancel">Отмена</button>
    </div>
  </div>
  <!-- Скрытый лист для печати: сюда грузится PDF-бланк, по нему вызываем print().
       Размер НЕнулевой и офскрин — иначе встроенный PDF-вьюер Chrome не отрисуется
       и печать выйдет пустой (для HTML было неважно, для PDF критично). -->
  <iframe id="printFrame" title="печать образца"
          style="position:fixed; left:-9999px; top:0; width:800px; height:1130px; border:0;"></iframe>

<!-- ?v — метка версии: меняешь answer_render.js — поменяй и её. Тогда браузер
     киоска (даже с закэшированным старьём) увидит НОВЫЙ адрес и скачает свежий
     файл по ОБЫЧНОЙ кнопке перезагрузки, без Ctrl+Shift+R (на киоске нет
     клавиатуры). Дальше свежесть держит no-cache из video_ui/server.py. -->
<script src="/static/qrcode.js?v=20260720"></script>
<script src="/static/answer_render.js?v=20260720b"></script>
<script src="/static/stream_client.js?v=20260728"></script>
<script src="/static/vad.js?v=20260729"></script>
<script src="/static/reload_guard.js?v=20260731"></script>
<script>
// ---------- режим киоска (?kiosk=1) ----------
const params = new URLSearchParams(location.search);
const KIOSK = params.get("kiosk") === "1";
if (KIOSK) document.body.classList.add("kiosk");

// ---------- номер киоска (?id=astana-01) ----------
// Точек в пилоте два десятка, и в логах они были неразличимы: непонятно, какая
// молчит вторые сутки, а на какой сыплется STT. Номер приходит параметром URL
// (kiosk-start.bat подставляет туда %COMPUTERNAME%) и уезжает полем `kiosk`
// с каждым вопросом. Чистим тут же: в лог сервера попадёт чужая строка, а
// переводы строк/длинный мусор ломали бы JSONL — оставляем буквы, цифры, ._-
const KIOSK_ID = (params.get("id") || "").replace(/[^A-Za-z0-9._-]/g, "").slice(0, 32);
// Пропуск точки (?key=): без него `id` — просто подпись, и отключённый регион
// обошёл бы рубильник, убрав параметр из ярлыка. Сверяет его сервер.
const KIOSK_KEY = (params.get("key") || "").replace(/[^A-Za-z0-9._-]/g, "").slice(0, 64);

// ---------- потоковая озвучка (?stream=1) ----------
// Обычный путь: ждём ВЕСЬ WAV (на длинном ответе это 6–20 c тишины у киоска).
// Потоковый: текст на экран сразу, звук — кусками по мере синтеза, первый звук
// через время ОДНОГО куска.
//
// ВКЛЮЧЁН ПО УМОЛЧАНИЮ с 2026-07-30. Дефолт живёт ЗДЕСЬ, а не в ярлыке киоска:
// страницу все 20 точек получают с сервера, поэтому переключение не требует
// переустановки архивов — ссылка у регионов остаётся та же.
// Откат — `?stream=0` в адресе (или эта строка обратно в false).
//
// Выигрыш растёт с длиной ответа, потому что время до первого звука почти не
// зависит от неё: распознавание + поиск в базе + синтез ТОЛЬКО первого куска.
// Оценка для F5 (~1,5 с на кусок 180 симв.): ответ на 700 символов — 7,5 с
// ожидания без потока против ~3 с с потоком, на 1500 — 13,5 с против ~3 с.
// На казахском (облако) замерено на бою: первый звук 11 с вместо 35 с.
// Если ответ влезает в ОДИН кусок, поток вырождается в обычный режим — то есть
// не вредит. Воспроизведение не отстаёт: кусок в 180 символов звучит ~12 с, а
// синтезируется ~1,5 с, поэтому очередь не опустеет.
const STREAM_DEFAULT = true;
const STREAM_TTS = params.get("stream") === null
  ? STREAM_DEFAULT : params.get("stream") === "1";

// ---------- полный экран (?kiosk=1) ----------
// Прячем адресную строку и хром браузера, чтобы киоск не выглядел как вкладка.
// Fullscreen API работает ТОЛЬКО из жеста пользователя, поэтому уходим в полный
// экран на первом же тапе по экрану (кнопка «Задать вопрос» тоже жест — событие
// всплывает сюда). Надёжнее в проде — запускать Chrome с флагом --kiosk (см.
// README), но этот путь работает и без него.
//
// ⚠️ НЕ включаем Fullscreen API, если окно и так во весь экран (Chrome --kiosk):
// печать (print()) СБРАСЫВАЕТ Fullscreen API, и киоск «выпадал» из полного экрана.
// Под --kiosk окно фуллскрин само собой — JS-фуллскрин не нужен и только мешает.
function browserAlreadyFullscreen() {
  return window.innerHeight >= screen.height - 2;   // нет хрома → это --kiosk/F11
}
function enterFullscreen() {
  if (!KIOSK || document.fullscreenElement || browserAlreadyFullscreen()) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { req.call(el); } catch (e) { /* браузер отказал вне жеста */ } }
}
if (KIOSK) document.addEventListener("click", enterFullscreen);

const idleV = document.getElementById("idle");
const talkV = document.getElementById("talk");
const noVid = document.getElementById("noVid");
// QR-overlay поверх видео (на груди аватара). Наполняет renderAnswer, прячем сами.

function showTalking() {

  talkV.play().catch(function () {});   // немое видео жеста не требует
  talkV.classList.add("on");
  idleV.classList.add("off");
}
function showIdle() {
  talkV.classList.remove("on");
  idleV.classList.remove("off");
  try { talkV.pause(); } catch (e) {}
}
// Ролика нет / битый файл — говорим прямо, а не показываем чёрный экран.
idleV.addEventListener("error", function () { noVid.style.display = "flex"; });

// ---------- звук ответа ----------
// Тишина-заглушка: проигрываем её ВНУТРИ жеста (клик по кнопке), чтобы снять
// autoplay-блокировку — тогда WAV, пришедший через несколько секунд, уже сыграет.
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=";
// Темп проговаривания зависит от ДВИЖКА TTS (не от языка) и приходит с бэкенда
// полем data.provider: Spark (офлайн-фолбэк казахского) медленный — ускоряем;
// ElevenLabs/F5 — в норме. Логика в speechRate() (answer_render.js), чтобы её
// покрывал node-тест и она не зависела от жёсткой константы (N7). Разгоняем
// плеером (playbackRate) — ничего не стоит и не роняет синтез (в отличие от
// SPARK_SPEED); preservesPitch держит тембр.
const answerAudio = new Audio();
let answerUrl = null, audioPrimed = false;

// В потоке «ended» — это конец КУСКА, а не ответа: играем следующий. Битый кусок
// (error) тоже не должен обрывать ответ — идём дальше, текст на экране уже есть.
answerAudio.addEventListener("ended", function () {
  if (streaming) { playNextChunk(); return; }
  showIdle();
});
answerAudio.addEventListener("error", function () {
  if (streaming) { playNextChunk(); return; }
  showIdle();
});

function primeAudio() {
  if (audioPrimed) return;
  audioPrimed = true;
  try { answerAudio.src = SILENT_WAV; answerAudio.play().catch(function () {}); } catch (e) {}
}

// base64 (audio_b64 из тела /voice) -> Blob для проигрывания. Текст ответа теперь
// приходит в JSON-теле, а не в заголовках, поэтому аудио — тоже из тела (N5).
function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

// ---------- потоковая очередь кусков ----------
// В потоке ответ приходит несколькими WAV: играем их подряд ОДНИМ плеером
// (у <audio> есть preservesPitch — Web Audio ускорял бы Spark вместе с питчем).
// Паузы на стыках уже вшиты бэкендом в хвост каждого куска.
const chunkQueue = createChunkQueue();
let streaming = false;               // идёт ли сейчас потоковый ответ
let streamProvider = null, streamFormat = "wav";

function playNextChunk() {
  const chunk = chunkQueue.next();
  if (!chunk) {
    // Кусков пока нет: либо поток кончился (уходим в idle), либо синтез не
    // успевает — тогда ждём, оставив «говорящий» ролик, и продолжим с приходом.
    if (chunkQueue.done()) finishAnswer();
    return;
  }
  if (answerUrl) URL.revokeObjectURL(answerUrl);
  answerUrl = URL.createObjectURL(chunk.blob);
  answerAudio.src = answerUrl;
  try { answerAudio.preservesPitch = true; answerAudio.webkitPreservesPitch = true; } catch (e) {}
  answerAudio.playbackRate = speechRate(streamProvider);   // src сбрасывает темп
  answerAudio.play().catch(function (e) {
    st.textContent = "звук заблокирован браузером: " + e.message;
    finishAnswer();
  });
}

function finishAnswer() {
  streaming = false;
  karaokeWords.forEach(w => w.classList.add("spoken"));
  karaokeIdx = karaokeWords.length;
  showIdle();
}

function enqueueChunk(blob, chars, provider) {
  streamProvider = provider || streamProvider;
  chunkQueue.push({ blob: blob, chars: chars });
  if (!chunkQueue.playing) {
    if (!streaming) {
      streaming = true;
      revealAnswer();                  // текст и голос появляются вместе
      showTalking();
    }
    playNextChunk();
  }
}

function playAnswer(blob, lang, provider) {
  if (answerUrl) URL.revokeObjectURL(answerUrl);
  answerUrl = URL.createObjectURL(blob);
  autoScroll = true;                 // новый ответ — прокрутка снова наша
  initKaraoke();                     // собрать слова свежего ответа
  answerAudio.src = answerUrl;
  // Ставим ПОСЛЕ src: смена источника сбрасывает playbackRate на 1.0.
  // preservesPitch — дефолт true в современных браузерах, но задаём явно
  // (webkit* — для Safari, где свойство до сих пор с префиксом).
  try { answerAudio.preservesPitch = true; answerAudio.webkitPreservesPitch = true; } catch (e) {}
  // Темп — по ДВИЖКУ, которым синтезировали (provider из тела /voice): Spark
  // ускоряем, ElevenLabs/F5 — 1.0 (N7). speechRate — в answer_render.js.
  answerAudio.playbackRate = speechRate(provider);
  showTalking();
  answerAudio.play().catch(function (e) {
    st.textContent = "звук заблокирован браузером: " + e.message;
    showIdle();
  });
}

// Прервать текущий ответ (звук + ролик «говорит»): посетитель не хочет дослушивать
// и жмёт «Задать вопрос» снова. Вызывается в начале новой записи. pause() не
// триггерит "ended", поэтому возврат в idle делаем сами.
function stopAnswer() {
  // Потоковый ответ — оборвать и запрос: досинтезировать то, что уже не слушают,
  // значит зря держать TTS/GPU-ноду (бэкенд отпустит семафор на разрыве).
  if (streamAbort) { try { streamAbort.abort(); } catch (e) {} streamAbort = null; }
  streaming = false;
  chunkQueue.reset();
  try { answerAudio.pause(); answerAudio.currentTime = 0; } catch (e) {}
  showIdle();
}

// ---------- запись с микрофона (16кГц WAV) ----------
const TARGET_SR = 16000;
function encodeWav(float32, sampleRate) {
  let peak = 0;
  for (let i = 0; i < float32.length; i++) { const a = Math.abs(float32[i]); if (a > peak) peak = a; }
  const gain = peak > 0.01 ? Math.min(4, 0.97 / peak) : 1;
  const ratio = sampleRate / TARGET_SR;
  const outLen = Math.floor(float32.length / ratio);
  const pcm = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio), end = Math.min(float32.length, Math.floor((i + 1) * ratio));
    let sum = 0, cnt = 0;
    for (let j = start; j < end; j++) { sum += float32[j]; cnt++; }
    let s = (cnt ? sum / cnt : 0) * gain;
    s = Math.max(-1, Math.min(1, s));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2);
  const v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE");
  w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, TARGET_SR, true); v.setUint32(28, TARGET_SR * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

// ---------- «караоке»: подсветка прочитанных слов ----------
// Слова прозы (спаны .w из answer_render.js) подсвечиваются по мере
// проговаривания. Точных таймингов у TTS нет, но темп F5 детерминирован длиной
// озвучиваемого текста, поэтому позиция = доля накопленного ВЕСА слов
// (вес ≈ длина слова В РЕЧИ: data-w считает answer_render.js — цифры и
// аббревиатуры голосом длиннее, знаки препинания несут вес пауз).
let karaokeWords = [], karaokeTotal = 0, karaokeIdx = 0;
function initKaraoke() {
  karaokeWords = Array.from(out.querySelectorAll(".aline .w"));
  karaokeTotal = karaokeWords.reduce((a, w) => a + (parseFloat(w.dataset.w) || 1), 0);
  karaokeIdx = 0;
}
function karaokeTick() {
  if (!karaokeWords.length || !answerAudio.duration) return;
  // В потоке доля времени внутри КУСКА пересчитывается в долю всего ответа по
  // символам (общая длительность станет известна только в конце) — см. stream_client.js.
  const within = answerAudio.currentTime / answerAudio.duration;
  const target = (streaming ? chunkQueue.progress(within) : within) * karaokeTotal;
  let acc = 0, i = 0;
  for (; i < karaokeWords.length; i++) {
    acc += parseFloat(karaokeWords[i].dataset.w) || 1;
    if (acc > target) break;
  }
  // i = первое НЕпрочитанное слово; двигаем классы только на разнице
  for (let k = karaokeIdx; k < i; k++) karaokeWords[k].classList.add("spoken");
  for (let k = i; k < karaokeIdx; k++) karaokeWords[k].classList.remove("spoken");
  karaokeIdx = i;
}
answerAudio.addEventListener("timeupdate", karaokeTick);
answerAudio.addEventListener("ended", () => {   // договорил — подсветить всё
  if (streaming) return;                        // в потоке ответ ещё продолжается
  karaokeWords.forEach(w => w.classList.add("spoken"));
  karaokeIdx = karaokeWords.length;
});

// ---------- автопрокрутка ответа ----------
// Длинный ответ может не влезать в карточку: держим В ВИДУ слово, которое сейчас
// читается (караоке-подсветка). Раньше прокрутка шла по ДОЛЕ ВРЕМЕНИ
// (currentTime/duration) — а слова весят по-разному и строки переносятся, поэтому
// прокрутка «уезжала» от подсветки и мешала читать. Теперь она идёт ЗА подсветкой:
// пока текущее слово выше 65% высоты карточки — не трогаем (текст стоит, читать
// спокойно); опустилось ниже — подматываем так, чтобы встало на ~40%. Только
// вперёд. Тронул карточку пальцем/колесом — до конца ЭТОГО ответа не вмешиваемся.
let autoScroll = true;
["touchstart", "wheel", "pointerdown"].forEach(ev =>
  out.addEventListener(ev, () => { autoScroll = false; }, { passive: true }));
answerAudio.addEventListener("timeupdate", () => {
  if (!autoScroll || !karaokeWords.length) return;
  const cur = karaokeWords[Math.min(karaokeIdx, karaokeWords.length - 1)];
  if (!cur) return;
  const or = out.getBoundingClientRect(), pos = cur.getBoundingClientRect().top - or.top;
  if (pos > or.height * 0.65) {
    const max = out.scrollHeight - out.clientHeight;
    out.scrollTop = Math.min(max, out.scrollTop + (pos - or.height * 0.40));
  }
});

// ---------- печать образцов заявлений ----------
// Когда ответ про подачу заявления/жалобы или запись на приём
// (detectPrintTemplates из answer_render.js), рядом с «Задать вопрос» встаёт
// зелёная кнопка печати, а под ответом — приглашение аватара. Клик открывает
// меню выбора образца; печать — PDF-бланк (static/templates/pdf/) в скрытом iframe.
// На киоске Chrome запускают с --kiosk-printing → лист уходит на принтер БЕЗ
// диалога (см. README). Без флага открывается обычный диалог печати браузера.
const printBtn = document.getElementById("printBtn");
const printMenu = document.getElementById("printMenu");
const printOpts = document.getElementById("printOpts");
const printFrame = document.getElementById("printFrame");
const printTitle = document.getElementById("printTitle");
const printSub = document.getElementById("printSub");

const TEMPLATE_LABELS = {
  fl:    { ru: "Для физических лиц",     kz: "Жеке тұлғаларға" },
  ul:    { ru: "Для юридических лиц",    kz: "Заңды тұлғаларға" },
  priem: { ru: "Запись на личный приём", kz: "Жеке қабылдауға жазылу" },
};
const PRINT_BTN_LABEL = { ru: "🖨 Распечатать образец", kz: "🖨 Үлгіні басып шығару" };
const PRINT_MENU_T = {
  ru: { title: "Распечатать образец", sub: "Выберите документ — киоск его распечатает" },
  kz: { title: "Үлгіні басып шығару", sub: "Құжатты таңдаңыз — киоск оны басып шығарады" },
};

let currentTemplates = [];   // подошедшие к ответу образцы (id-шники fl/ul/priem)
let printLang = "ru";        // язык печатаемого бланка (по языку ответа, переключаем в меню)

function langCode(lang) { return (lang === "kazakh" || lang === "kz") ? "kz" : "ru"; }

// Кнопка печати в баре. Список образцов — точный из заголовка X-Print (бэкенд),
// иначе (демо без бэкенда) — детект по тексту ответа. Приглашение НЕ рисуем: его
// аватар проговаривает и оно уже в тексте ответа (бэкенд дописал, органично).
function updatePrintButton(printIds, text, lang) {
  currentTemplates = (printIds && printIds.length)
    ? printIds
    : ((typeof detectPrintTemplates === "function") ? detectPrintTemplates(text || "") : []);
  if (!currentTemplates.length) { printBtn.hidden = true; return; }
  printLang = langCode(lang);
  printBtn.hidden = false;
  printBtn.textContent = PRINT_BTN_LABEL[printLang];
}

// Меню выбора образца на языке printLang (кнопки — из подошедших образцов).
function renderPrintMenu() {
  const t = PRINT_MENU_T[printLang];
  printTitle.textContent = t.title;
  printSub.textContent = t.sub;
  printMenu.querySelectorAll(".print-lang button").forEach(b =>
    b.classList.toggle("active", b.dataset.l === printLang));
  printOpts.textContent = "";
  currentTemplates.forEach(id => {
    const b = document.createElement("button");
    b.textContent = TEMPLATE_LABELS[id][printLang];
    b.onclick = () => doPrint(id, printLang);
    printOpts.appendChild(b);
  });
}
function openPrintMenu() { renderPrintMenu(); printMenu.classList.add("on"); }
function closePrintMenu() { printMenu.classList.remove("on"); }

// Печать: грузим готовый официальный PDF-бланк в iframe и по загрузке вызываем
// print() (пиксель-в-пиксель как оригинал, не HTML-реконструкция). Chrome печатает
// same-origin PDF из iframe так же тихо под --kiosk-printing. Нонс в URL — чтобы
// повторная печать того же бланка снова триггерила onload.
function doPrint(type, lang) {
  const url = "/static/templates/pdf/" + type + "-" + lang + ".pdf?_=" + Date.now();
  printFrame.onload = function () {
    setTimeout(function () {
      try { printFrame.contentWindow.focus(); printFrame.contentWindow.print(); }
      catch (e) { st.textContent = "печать недоступна: " + e.message; }
    }, 700);   // PDF-вьюеру нужно больше времени отрисоваться, чем HTML
  };
  printFrame.src = url;
  closePrintMenu();
}

function hidePrint() { printBtn.hidden = true; closePrintMenu(); currentTemplates = []; }

printBtn.onclick = openPrintMenu;
document.getElementById("printCancel").onclick = closePrintMenu;
printMenu.addEventListener("click", e => { if (e.target === printMenu) closePrintMenu(); });

    "Физические лица | 100 МРП\n" +
    "Малое предпринимательство | 200 МРП\n" +
    "Среднее предпринимательство | 400 МРП\n" +
    "Крупное предпринимательство | 1 000 МРП\n" +
    "[/ТАБЛИЦА]\n" +
    "Подать обращение можно через портал e-Otinish, а заявление о мошенничестве — на qamqor.gov.kz. " +
    // В реальном потоке это приглашение дописывает бэкенд (service.with_print_offer)
    // и аватар его проговаривает; в демо добавляем строкой — показать, как читается.
    "Если хотите, я могу распечатать образец заявления — нажмите кнопку «Распечатать образец».");
}

const langSel = document.getElementById("lang");
const langBadge = document.getElementById("langBadge");
function syncBadge() { langBadge.textContent = langSel.value === "kazakh" ? "ҚАЗ" : "RU"; }
langBadge.onclick = () => {
  langSel.value = langSel.value === "kazakh" ? "russian" : "kazakh";
  syncBadge();
};
syncBadge();

// Авто-стоп: тишина дольше SILENCE_MS после речи — завершаем запись сами.
const SILENCE_MS = 2000;
// Предел длительности. Авто-стоп выше ждёт РЕЧЬ, поэтому без этого предела
// запись «нажал кнопку и отошёл» не заканчивалась никогда: она копила фоновый
// шум фойе, набирала ложное звучание и уходила в STT, который выдумывал вопрос
// («Продолжение следует.» на киоске 30.07). 25 с — заведомо больше любого
// реального вопроса; если речь была, отправим что записалось, если нет —
// сработает проверка в stopAndSend и экран попросит повторить.
const MAX_RECORD_MS = 25000;
// ...а если речи не было ВООБЩЕ — ждать эти 25 секунд незачем. Авто-стоп выше
// срабатывает ТОЛЬКО после речи (тишина до первого слова в счётчик не идёт),
// поэтому нажал кнопку и промолчал = запись висела до предела, а гражданин стоял
// у экрана и не понимал, что происходит (отзыв с киоска 17.08 — «автостоп плохо
// работает»). 7 с заведомо больше паузы «собраться с мыслями» у того, кто ТОЛЬКО
// ЧТО нажал «Задать вопрос»; дальше показываем «Не услышал вопрос» и ждём
// повторного нажатия. В STT такая запись, как и раньше, НЕ уходит.
const NO_SPEECH_MS = 7000;
// Была ли речь — решает детектор из vad.js (адаптивный порог от фонового шума
// + накопленное время звучания). Прежний одиночный порог амплитуды в фойе
// срабатывал на вдохе и стуке, и тишина уходила в STT, а тот выдумывал вопрос
// («Продолжение следует.», «Редактор субтитров…» — реальные случаи с киоска).
let vad = null;
let stopping = false;
let maxRecordTimer = null;
let noSpeechTimer = null;

async function startRecording() {
  stopAnswer();   // аватар ещё договаривает прошлый ответ? обрываем — посетитель хочет спросить заново
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { st.textContent = "нет доступа к микрофону: " + e.message; return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  src = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  chunks = []; stopping = false;
  vad = AidosVad.createVad();
  proc.onaudioprocess = e => {
    const buf = e.inputBuffer.getChannelData(0);
    chunks.push(new Float32Array(buf));
    // RMS, а не пик: одиночный щелчок даёт большой пик при крошечном RMS.
    vad.push(AidosVad.rmsOf(buf), buf.length / ctx.sampleRate * 1000);
    // Останавливаемся сами, когда после РЕЧИ пошла тишина: пауза до первого
    // слова (посетитель собирается с мыслями) в счётчик не идёт — это в vad.js.
    if (vad.hasSpeech() && vad.silenceMs() > SILENCE_MS) stopAndSend();
  };
  src.connect(proc); proc.connect(ctx.destination);
  recording = true; btn.classList.add("rec"); btn.textContent = "⏹ Готово, отправить";
  st.textContent = "говорите...";
  clearTimeout(maxRecordTimer);
  maxRecordTimer = setTimeout(function () { if (recording) stopAndSend(); }, MAX_RECORD_MS);
  // Речь так и не началась — заканчиваем сами, не дожидаясь предела записи.
  clearTimeout(noSpeechTimer);
  noSpeechTimer = setTimeout(function () {
    if (recording && (!vad || !vad.hasSpeech())) stopAndSend();
  }, NO_SPEECH_MS);
}

async function stopAndSend() {
  if (!recording || stopping) return;
  clearTimeout(maxRecordTimer);
  clearTimeout(noSpeechTimer);
  stopping = true; recording = false;
  btn.classList.remove("rec"); btn.textContent = "🎙 Задать вопрос";
  proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t => t.stop());
  const len = chunks.reduce((a, c) => a + c.length, 0);
  // ТИШИНУ НЕ ОТПРАВЛЯЕМ. Посетитель нажал «Задать вопрос» и передумал, или
  // рядом просто шумно — движок STT на пустой записи выдумывает текст: в логах
  // 29.07 это «Редактор субтитров А.Семкин Корректор А.Кулакова» и «деду, деду,
  // деду…» (обрывки из обучающих данных). Дальше киоск честно ищет ответ на
  // выдуманный вопрос, тратит облако и показывает гражданину отказ. Решает
  // детектор из vad.js: порог считается от фонового шума ЭТОЙ записи, и нужно
  // накопить 300 мс звучания — вдох, стук и чужой разговор порог не проходят.
  if (!vad || !vad.hasSpeech()) {
    ctx.close();
    stopping = false;
    btn.disabled = false;
    showIdle();
    st.textContent = langSel.value === "kazakh"
      ? "Дыбыс естілмеді — қайта сұрап көріңіз"
      : "Не услышал вопрос — попробуйте ещё раз";
    return;
  }
  const flat = new Float32Array(len);
  let off = 0; for (const c of chunks) { flat.set(c, off); off += c.length; }
  const wav = encodeWav(flat, ctx.sampleRate);
  ctx.close();
  showProcessing();
  st.textContent = "обрабатываю вопрос...";
  btn.disabled = true;
  const fd = new FormData();
  const askedLang = langSel.value;   // фиксируем: ответ придёт через секунды, селект мог смениться
  fd.append("data", wav, "q.wav");
  fd.append("language", askedLang);
  // Подсказка с прошлого ответа («возможно, вы хотели спросить…»): бэкенд по ней
  // поймёт, что реплика «да» = согласие ответить на исправленный вопрос.
  if (pendingSuggest) fd.append("suggest", pendingSuggest);
  // Номер точки — в аналитику (поле `kiosk` в interactions.jsonl и в journald).
  if (KIOSK_ID) fd.append("kiosk", KIOSK_ID);
  if (KIOSK_KEY) fd.append("key", KIOSK_KEY);
  try {
    if (STREAM_TTS) { await askStreaming(fd, askedLang); return; }
    // /voice тут — прокси на рабочий бэкенд (:8000). Контракт — JSON-тело (N5):
    // {question, answer, suggest, print, provider, format, audio_b64}. Текст и
    // аудио в теле, не в заголовках: длинный табличный ответ доходит целиком.
    const r = await fetch("/voice", { method: "POST", body: fd });
    if (!r.ok) throw await backendError(r);
    const data = await r.json();
    const q = data.question || "";
    const a = data.answer || "";
    pendingSuggest = data.suggest || null;
    // print — какие образцы предложить (fl/ul/priem), решил бэкенд по ответу.
    const printIds = (data.print && data.print.length) ? data.print : null;
    showQA(q, a, askedLang, printIds);   // askedLang — язык вопроса: на нём кнопка/бланк

    st.textContent = "ответ готов";
    if (data.audio_b64) {
      const blob = b64ToBlob(data.audio_b64, "audio/" + (data.format || "wav"));
      playAnswer(blob, askedLang, data.provider);  // темп — по data.provider (N7)
    } else {
      showIdle();                        // TTS выключен — показываем только текст
    }
  } catch (e) {
    if (e.name === "AbortError") return;   // посетитель сам прервал — не «ошибка»
    out.className = "";
    // Плановое отключение точки — не сбой: гражданину незачем видеть слово
    // «Ошибка», ему нужно объяснение, почему киоск сегодня не отвечает.
    out.textContent = e.planned ? e.message : "Ошибка: " + e.message;
    st.textContent = e.planned ? "точка отключена" : "ошибка";
    showIdle();
  } finally {
    btn.disabled = false;
  }
}

// ---------- потоковый ответ (?stream=1) ----------
// Читаем NDJSON построчно: первая строка (meta) кладёт текст на экран сразу
// после RAG, дальше идут куски озвучки — их складываем в очередь, плеер играет
// подряд. Так гражданин слышит начало, пока досинтезируется остальное.
let streamAbort = null;

// Ответ бэкенда с ошибкой -> исключение. 503 — это НЕ сбой, а плановое
// отключение точки оператором (список kiosks-disabled.txt на сервере):
// помечаем его, чтобы экран показал человеческий текст, а не «Ошибка: …».
async function backendError(r) {
  const j = await r.json().catch(() => ({}));
  const e = new Error(j.detail || r.status);
  e.planned = r.status === 503;
  return e;
}

async function askStreaming(fd, askedLang) {
  streamAbort = new AbortController();
  chunkQueue.reset();
  pendingAnswer = null;                // прошлый ответ уже не покажем
  streamProvider = null;
  const r = await fetch("/voice/stream", { method: "POST", body: fd,
                                           signal: streamAbort.signal });
  if (!r.ok) throw await backendError(r);
  const parser = createNdjsonParser();
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      parser.feed(dec.decode(value, { stream: true }))
            .forEach(ev => handleStreamEvent(ev, askedLang));
    }
    parser.flush().forEach(ev => handleStreamEvent(ev, askedLang));
  } finally {
    streamAbort = null;
    btn.disabled = false;              // спрашивать снова можно, не дослушав
  }
  chunkQueue.finished = true;
  if (chunkQueue.done()) {
    revealAnswer();                    // звука не было вовсе (TTS выключен)
    showIdle();
  }
}

// Строка meta приходит СРАЗУ после поиска в базе, то есть примерно за полторы
// секунды до первого звука. Показывать по ней весь ответ — плохо по двум
// причинам: текст рассинхронизирован с голосом, и весь ответ на минуту речи
// читается мгновенно — гражданин дочитывает и стоит, слушая пересказ уже
// прочитанного, а караоке-подсветка еле ползёт в начале.
// Поэтому по meta показываем ТОЛЬКО вопрос («я тебя услышал»), а ответ — в
// момент старта озвучки, см. revealAnswer().
let pendingAnswer = null;

function revealAnswer() {
  if (!pendingAnswer) return;
  const p = pendingAnswer;
  pendingAnswer = null;                // идемпотентно: зовём из нескольких мест
  showQA(p.q, p.a, p.lang, p.printIds);
  initKaraoke();                       // слова появились только сейчас
}

function handleStreamEvent(ev, askedLang) {
  if (ev.type === "meta") {
    pendingSuggest = ev.suggest || null;
    const printIds = (ev.print && ev.print.length) ? ev.print : null;
    pendingAnswer = { q: ev.question || "", a: ev.answer || "",
                      lang: askedLang, printIds: printIds };
    showQA(ev.question || "", "", askedLang, null);   // пока только вопрос
    autoScroll = true;                 // новый ответ — прокрутка снова наша
    chunkQueue.totalChars = ev.speech_chars || 0;
    streamProvider = ev.provider;
    streamFormat = ev.format || "wav";
    st.textContent = "ответ найден, озвучиваю...";
  } else if (ev.type === "audio") {
    enqueueChunk(b64ToBlob(ev.audio_b64, "audio/" + streamFormat), ev.chars, ev.provider);
  } else if (ev.type === "error") {
    // Статус 200 уже отдан, поэтому сбой синтеза приходит строкой. Голос молчит,
    // но текст ответа гражданин получить ОБЯЗАН — иначе он остался ни с чем.
    revealAnswer();
    st.textContent = "ошибка озвучки: " + (ev.detail || "поток прерван");
    chunkQueue.finished = true;
    if (!chunkQueue.playing) finishAnswer();
  } else if (ev.type === "end") {
    chunkQueue.finished = true;
  }
}

btn.onclick = () => {
  if (blockedMessage) return;      // точка отключена оператором — записывать нечего
  primeAudio();                    // снимаем autoplay-блок внутри жеста
  if (recording) stopAndSend(); else startRecording();
};

// ---------- пинг: точка отмечается живой и узнаёт, не отключили ли её ----------
// Два дела за один дешёвый запрос. Без него сервер до первого вопроса не знает,
// жива ли точка вообще (погасшую видно только по ОТСУТСТВИЮ строк в отчёте), а
// гражданин узнаёт об отключении лишь ПОСЛЕ того, как подошёл, нажал и
// продиктовал вопрос.
let blockedMessage = null;
let pingTimer = null;

function applyBlocked(message) {
  if (message === blockedMessage) return;   // ничего не изменилось — не дёргаем экран
  blockedMessage = message;
  if (message) {
    btn.disabled = true;
    out.className = "";
    out.textContent = message;
  } else {
    btn.disabled = false;
    showIdle();
  }
}

// --- Перезагрузка страницы по команде сервера ------------------------------
// Браузер киоска открыт сутками и код страницы сам не перечитывает: правка в
// static/** доезжала до региона только с перезапуском .bat, то есть обзвоном 20
// городов. Сервер отдаёт в пинге версию кода; разошлась со своей — перечитываем.
let uiVersion = null;      // версия, с которой загрузилась ИМЕННО эта страница
let reloadArmed = false;

function kioskIdle() {
  // Само правило — в reload_guard.js (чистая функция, покрыта тестами): здесь
  // только снимаем состояние страницы.
  return AidosReloadGuard.isIdle({
    blocked: !!blockedMessage,
    recording: recording,
    buttonDisabled: btn.disabled,
    audioPaused: answerAudio.paused,
    streaming: !!streamAbort,
  });
}

function armReload() {
  if (reloadArmed) return;
  reloadArmed = true;
  (function attempt() {
    let last = 0;
    try { last = Number(sessionStorage.getItem("aidosReloadAt") || 0); }
    catch (e) { /* приватный режим — переживём без защиты от цикла */ }
    if (!AidosReloadGuard.shouldReload({ idle: kioskIdle(), lastReloadAt: last,
                                         now: Date.now() })) {
      // Не время: либо точка занята (догонит, когда договорит), либо только что
      // перезагружались. И то и другое лечится ожиданием, поэтому просто ждём.
      setTimeout(attempt, 3000);
      return;
    }
    try { sessionStorage.setItem("aidosReloadAt", String(Date.now())); } catch (e) {}
    location.reload();
  })();
}

async function pingServer() {
  let next = 60;
  try {
    const fd = new FormData();
    fd.append("kiosk", KIOSK_ID);
    fd.append("key", KIOSK_KEY);
    const r = await fetch("/kiosk/ping", { method: "POST", body: fd });
    if (r.ok) {
      const s = await r.json();
      applyBlocked(s.enabled ? null : (s.message || ""));
      next = s.ping_seconds || next;
      if (AidosReloadGuard.versionChanged(uiVersion, s.ui_version)) armReload();
      if (uiVersion === null && s.ui_version) uiVersion = s.ui_version;
    }
    // Сеть моргнула или бэкенд лежит — молчим: киоск не должен пугать
    // гражданина сообщением из-за одного неудачного пинга. Экран поменяется,
    // только когда сервер ЯВНО скажет, что точка отключена.
  } catch (e) { /* киоск не падает из-за пинга */ }
  pingTimer = setTimeout(pingServer, Math.max(15, next) * 1000);
}

// Без номера точки heartbeat бессмыслен: серверу нечего запоминать.
if (KIOSK_ID) pingServer();
</script>
